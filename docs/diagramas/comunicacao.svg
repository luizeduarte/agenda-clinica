ll="#000" font-size="14" textLength="395.176">AgendarConsulta exige papel PACIENTE antes de criar o Slot.</text><text x="197.15" y="480.38" fill="#000" font-size="14" textLength="393.454">O horário futuro é validado antes e após adquirir o bloqueio.</text><text x="197.15" y="500.651" fill="#000" font-size="14" textLength="424.044">As verificações das agendas lançam exceção em caso de rejeição.</text><text x="197.15" y="520.923" fill="#000" font-size="14" textLength="424.422">Cenário de sucesso. O retorno de executar ocorre após o commit.</text><text x="197.15" y="541.195" fill="#000" font-size="14" textLength="413.964">ConsultaRepositorio e NotificacaoPendenteRepositorio gravam</text><text x="197.15" y="561.467" fill="#000" font-size="14" textLength="347.493">na mesma transação. O envio ocorre posteriormente.</text></g><?plantuml-src ZLRDRjj64BxpAQQvL09inKhID2NQ08hi9BtOGcsZXxeGHkI8sfZSONQNYfq7oBde6nGz14MFGK-zHM-I9-diZspQJj7Un9sPRx_vvcVrHMkmQX1glEJEWMt8eSOii-TAjsYmWOOr5ol33O4p7VKi2opEAyETBgTSiu4tA-NwTbwyei8z-tzUR4eoqMDHIqZFewQATFbVECdh3ivAbGJKjEuI6ceMP6mloAwmv3TALx34slRXIbfYLxldhDqXIkx7gEqn6RNylC-nUaimVjGpEkLgkZOzwPaqbsIfXOTxlKE3-jmVFkw3r4gJksm9Mgul_KUM1LoOSjDfLU3c_UPtXbsO-EHH4jTM64a1ewnmBu-MXhHZiJh3TKtc7g25wRMJPBPM1Kyw9tu2Mo075pbOtOQwkYHudFPHQdRXy2KRD8glBQTQbLZIFfqON62zYkYd_EELom_KibLkyq7Yx9aUj6mSsc7m2xRRD6Q6byfQnHhho7LsnmKB9VbGDFU8tiZ0VroRRiJCicm6kqPLAxSBKyZXqxjVOPp3xEZu1EuN2KNeUftOgBVeX4yEpmWD6VZMyJdffsVwqxjVO3nwcCFBavCPFDWRPzCjxDEWiK2FHmBSsSuB1_btPwAOhyLIgc46XI7vAXJMGnygFQibydGQuXxaiAKI0kc2YixvA6vGbppCCl7ShMdfhqkrYP7-JYjLapZ0kVISKsPUqa19RoaUdcdl8_Xa7SurpvUTwmmFi1AGP7tqBzPmvpP7gNIwK4G8u49l2FSZXx5Fe6cK6mopB-480ez2jIXrW1kD0LYPhaM8tG6biavf_ykFYmTfiP3CWS5Fc5xnAD18UWMenEEh7AGZ_QSe9X8RgYGk7CMylia1Iw-23af6VLFEuxs-iPLUyoqpxDyrcQMB7kUmzdl3rt4kX5lMQatrmCj-Co9LS_HrFwALNJ77E7WXPaSAR5lolH1cQgxA7UX9dj1yLoUy9pby_5Cw21rz_5jwzSN1uVvaVvA9rXChAwRoM-Glii15Q6SGPBtogzdUA8KO5gWkH5k60gtNM1fM99PSTt-IFIig_7pLrTDC4hfp78OjSBjZYbEUnJqE2tQEcmnWEv1mFGzolpG0XEbAixO3QuNmcJNs7Czf932tTXVGXQfahM9BDS