harray:7,7;" fill="none"/></g><g class="link" data-entity-1="ent0010" data-entity-2="ent0007" id="lnk29" data-link-type="dependency"><polygon points="612,219.256,608,228.256,612,224.256,616,228.256,612,219.256" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M612,224.256 C612,249.984 612,273.408 612,298.692" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none"/></g><g class="legend" data-source-line="92"><rect x="405.479" y="896.064" width="463.542" height="192.447" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="410.479" y="917.304" fill="#000" font-size="14" textLength="398.382">Consulta e AgendaPaciente pertencem ao módulo Consultas.</text><text x="410.479" y="937.576" fill="#000" font-size="14" textLength="408.602">Cada paciente tem uma agenda no modelo. /consultas ativas é</text><text x="410.479" y="957.848" fill="#000" font-size="14" textLength="453.542">uma visão em memória construída a partir das consultas do paciente.</text><text x="410.479" y="978.12" fill="#000" font-size="14" textLength="439.78">A consulta copia a especialidade do profissional ao agendar (RN08).</text><text x="410.479" y="998.391" fill="#000" font-size="14" textLength="414.804">confirmar(), cancelar() e PoliticaDeCancelamento são previstos,</text><text x="410.479" y="1018.663" fill="#000" font-size="14" textLength="282.771">fora do recorte do protótipo (RN05 e RN07).</text><text x="410.479" y="1038.935" fill="#000" font-size="14" textLength="424.044">As verificações das agendas lançam exceção em caso de rejeição.</text><text x="410.479" y="1059.207" fill="#000" font-size="14" textLength="260.035">Slot: 30 min, início em :00 ou :30 (RN02).</text><text x="410.479" y="1079.479" fill="#000" font-size="14" textLength="321.901">AGENDADA e CONFIRMADA ocupam o slot (RN03).</text></g><?plantuml-src jLRDRXit4BxlKqnzacrPLUeM3GJ3m5goMmEk4bZffKqXqBiZYSqkPqjobQQf7wRe8MW1dum-mRvOXzmVxKgAcqil4fVyllc