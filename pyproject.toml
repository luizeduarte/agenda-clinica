[project]
name = "clinica"
version = "0.1.0"
description = "Agendamento de consultas em clínica universitária (trabalho de Design de Software)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clinica = [
    "infraestrutura/persistencia/*.sql",
    "api/demonstracao/*.html",
    "api/demonstracao/estaticos/*.css",
    "api/demonstracao/estaticos/*.js",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
